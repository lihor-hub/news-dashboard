services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    environment:
      POSTGRES_DB: news_dashboard
      POSTGRES_USER: news_dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - news-dashboard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_dashboard -d news_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community@sha256:362542416de6c09a971484d1893878016cc3b5cdec166e54b1c824a220ecd6b9
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
    volumes:
      - news-dashboard-neo4j:/data
    restart: unless-stopped

  news-dashboard:
    # CI-built application exception: this successful CI source SHA is immutable;
    # the deploy job receives the source SHA but not the registry digest output.
    image: ghcr.io/lihor-hub/news-dashboard:7d01027c3c2b21a537ab3264ce485d4fea6ba48d
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: news_dashboard
      POSTGRES_USER: news_dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?BOOTSTRAP_ADMIN_USERNAME is required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      # Optional outbound email delivery. Empty passthroughs keep it disabled.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-}
      OTP_SMTP_HOST: ${OTP_SMTP_HOST:-}
      OTP_SMTP_PORT: ${OTP_SMTP_PORT:-}
      OTP_SMTP_USER: ${OTP_SMTP_USER:-}
      OTP_SMTP_PASS: ${OTP_SMTP_PASS:-}
      OTP_SMTP_FROM: ${OTP_SMTP_FROM:-}
      OTP_SMTP_TLS: ${OTP_SMTP_TLS:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      # Legacy credential aliases remain available to the OTP mailer.
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_DATABASE: neo4j
      DATA_DIR: /data
      # Optional AI features (uncomment as needed)
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # FREE_LLM_API_KEY: ${FREE_LLM_API_KEY:-}
      # FREE_LLM_BASE_URL: ${FREE_LLM_BASE_URL:-}
      # Optional Dify iframe assistant. Leave disabled unless all DIFY_CHAT_* values are configured.
      DIFY_CHAT_ENABLED: ${DIFY_CHAT_ENABLED:-false}
      DIFY_CHAT_BASE_URL: ${DIFY_CHAT_BASE_URL:-}
      DIFY_CHAT_APP_TOKEN: ${DIFY_CHAT_APP_TOKEN:-}
      DIFY_CHAT_TITLE: ${DIFY_CHAT_TITLE:-News Assistant}
    volumes:
      - news-dashboard-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  news-dashboard-postgres:
  news-dashboard-neo4j:
  news-dashboard-data:
