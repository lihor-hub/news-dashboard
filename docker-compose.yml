services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: news_dashboard
      POSTGRES_USER: news_dashboard
      POSTGRES_PASSWORD: news-dashboard-local-password
    volumes:
      - news-dashboard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_dashboard -d news_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/news-dashboard-neo4j-local-password
    volumes:
      - news-dashboard-neo4j:/data
    restart: unless-stopped

  news-dashboard:
    build: .
    image: news-dashboard:local
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: news_dashboard
      POSTGRES_USER: news_dashboard
      POSTGRES_PASSWORD: news-dashboard-local-password
      # Local-development-only auth defaults. Override all three for any non-local deployment.
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-secret-change-before-deploying-00000000000}
      # Optional: override digest mark-read token signing separately from SESSION_SECRET.
      TOKEN_SECRET: ${TOKEN_SECRET:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AI_TEXT_PROVIDER: ${AI_TEXT_PROVIDER:-gateway}
      AI_MODEL_PRESET: ${AI_MODEL_PRESET:-}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
      CHATGPT_CREDENTIALS_FILE: ${CHATGPT_CREDENTIALS_FILE:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
      OPENAI_BRIEFING_MODEL: ${OPENAI_BRIEFING_MODEL:-}
      OPENAI_BRIEFING_ENRICHMENT_MODEL: ${OPENAI_BRIEFING_ENRICHMENT_MODEL:-}
      OPENAI_ANSWER_MODEL: ${OPENAI_ANSWER_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
      OPENAI_INSIGHTS_MODEL: ${OPENAI_INSIGHTS_MODEL:-}
      OPENAI_LESSON_CHAT_MODEL: ${OPENAI_LESSON_CHAT_MODEL:-}
      OPENAI_ENTITIES_MODEL: ${OPENAI_ENTITIES_MODEL:-}
      OPENAI_AGENT_ACTIONS_MODEL: ${OPENAI_AGENT_ACTIONS_MODEL:-}
      OPENAI_OPTIMIZER_MODEL: ${OPENAI_OPTIMIZER_MODEL:-}
      OPENAI_PERSPECTIVES_MODEL: ${OPENAI_PERSPECTIVES_MODEL:-}
      OPENAI_QUIZ_MODEL: ${OPENAI_QUIZ_MODEL:-}
      OPENAI_READING_LIST_SUMMARY_MODEL: ${OPENAI_READING_LIST_SUMMARY_MODEL:-}
      OPENAI_WATCHLIST_MODEL: ${OPENAI_WATCHLIST_MODEL:-}
      FREE_LLM_API_KEY: ${FREE_LLM_API_KEY:-}
      FREE_LLM_BASE_URL: ${FREE_LLM_BASE_URL:-}
      DIFY_CHAT_ENABLED: ${DIFY_CHAT_ENABLED:-false}
      DIFY_CHAT_BASE_URL: ${DIFY_CHAT_BASE_URL:-}
      DIFY_CHAT_APP_TOKEN: ${DIFY_CHAT_APP_TOKEN:-}
      DIFY_CHAT_TITLE: ${DIFY_CHAT_TITLE:-News Assistant}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-}
      OTP_SMTP_HOST: ${OTP_SMTP_HOST:-}
      OTP_SMTP_PORT: ${OTP_SMTP_PORT:-}
      OTP_SMTP_USER: ${OTP_SMTP_USER:-}
      OTP_SMTP_PASS: ${OTP_SMTP_PASS:-}
      OTP_SMTP_FROM: ${OTP_SMTP_FROM:-}
      OTP_SMTP_TLS: ${OTP_SMTP_TLS:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      # FastMCP shares the app listener and is enabled unless explicitly disabled.
      MCP_SERVER_ENABLED: ${MCP_SERVER_ENABLED:-true}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost:8080,127.0.0.1:8080,[::1]:8080}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://[::1]:8080}
      # Legacy credential aliases remain available to the OTP mailer.
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-news-dashboard-neo4j-local-password}
      NEO4J_DATABASE: neo4j
      DATA_DIR: /data
    volumes:
      - news-dashboard-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  news-dashboard-postgres:
  news-dashboard-neo4j:
  news-dashboard-data:
