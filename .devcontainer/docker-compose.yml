services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    user: vscode
    environment:
      DATABASE_URL: "postgresql://news_dashboard:news-dashboard-local-password@db:5432/news_dashboard"
      TEST_DATABASE_URL: "postgresql://news_dashboard:news-dashboard-local-password@db:5432/news_dashboard_test"
      SESSION_SECRET: "dev-only-secret-change-before-deploying-00000000000"
      BOOTSTRAP_ADMIN_USERNAME: "admin"
      BOOTSTRAP_ADMIN_PASSWORD: "change-me"
      PGOPTIONS: "-c max_parallel_workers_per_gather=0"
    volumes:
      - ..:/workspace:cached
      - devcontainer-venv:/workspace/.venv
      - devcontainer-node-modules:/workspace/node_modules
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: news_dashboard
      POSTGRES_USER: news_dashboard
      POSTGRES_PASSWORD: news-dashboard-local-password
    volumes:
      - news-dashboard-postgres-dev:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U news_dashboard -d news_dashboard']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  news-dashboard-postgres-dev:
  devcontainer-venv:
  devcontainer-node-modules:
