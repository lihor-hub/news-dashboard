name: Runtime image security

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/prune_selenium_manager.py'
      - 'scripts/test_selenium_manager_pruning.py'
      - '.github/workflows/runtime-security.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    name: Runtime security (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the production runtime and verify installer removal
        run: |
          docker build --tag news-dashboard-security:validation .
          docker run --rm news-dashboard-security:validation python -c 'import importlib.util, os; assert importlib.util.find_spec("pip") is None; assert os.getuid() != 0'
          docker run --rm news-dashboard-security:validation news-dashboard --help
          docker run --rm news-dashboard-security:validation python -c 'from pathlib import Path; import selenium; assert not any(Path(selenium.__file__).parent.rglob("selenium-manager*"))'
      - name: Scan runtime with the existing vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: news-dashboard-security:validation
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-results.sarif
          category: runtime-security-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-security-${{ matrix.arch }}
          path: trivy-results.sarif
