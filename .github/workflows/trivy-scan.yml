name: Weekly Trivy vulnerability scan

# Weekly scheduled scan of the latest container image to catch newly disclosed CVEs.
# Runs every Sunday at 02:00 UTC.

on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday at 02:00 UTC
  workflow_dispatch:  # Allow manual triggering

env:
  # Full image name. GITHUB_REPOSITORY is "owner/repo" (lower-cased by GHCR).
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  trivy-scan:
    name: Weekly Trivy vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner on latest image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:latest
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'  # Fail on any vulnerabilities
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@bce182f857edf1feab116e9795a3393d21977282 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-weekly
