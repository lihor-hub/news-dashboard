name: Weekly Trivy vulnerability scan

# Weekly scheduled scan of the latest container image to catch newly disclosed CVEs.
# Runs every Sunday at 02:00 UTC.

on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday at 02:00 UTC
  workflow_dispatch:  # Allow manual triggering

env:
  # Full image name. GITHUB_REPOSITORY is "owner/repo" (lower-cased by GHCR).
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  trivy-scan:
    name: Weekly Trivy vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner on latest image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:latest
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'  # Fail on any vulnerabilities
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-weekly
