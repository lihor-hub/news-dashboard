name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5
        with:
          fail-on-severity: high
          # Explicitly left permissive for licenses to allow any open-source license compatible with MIT.
          # If we want to prevent GPL/copyleft code being introduced in the future, we could configure deny-licenses here.

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      # audit-ci wraps `npm audit` so known-unfixable advisories can be
      # allowlisted with a tracked justification in .audit-ci.jsonc instead
      # of leaving the gate permanently red. New advisories still fail.
      - name: npm audit (root, moderate+)
        run: npx audit-ci@^7 --config .audit-ci.jsonc

      # The docs site is build-time-only. Keep critical vulnerabilities
      # blocking, while high findings remain visible in the audit output.
      - name: npm audit (website, critical)
        working-directory: website
        run: npx audit-ci@^7 --critical
