name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          # Explicitly left permissive for licenses to allow any open-source license compatible with MIT.
          # If we want to prevent GPL/copyleft code being introduced in the future, we could configure deny-licenses here.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'

      # audit-ci wraps `npm audit` so known-unfixable advisories can be
      # allowlisted with a tracked justification in .audit-ci.jsonc instead
      # of leaving the gate permanently red. New advisories still fail.
      - name: npm audit (root, moderate+)
        run: npx audit-ci@^7 --config .audit-ci.jsonc

      - name: npm audit (website, moderate+)
        working-directory: website
        run: npx audit-ci@^7 --config ../.audit-ci.jsonc
