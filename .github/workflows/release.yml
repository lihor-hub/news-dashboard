name: Release

# Tags each release and builds the downloadable Android / Desktop artifacts.
#
# The version itself is NOT committed to git — it is derived from the latest v*
# tag plus the Conventional Commits since it (see scripts/next_version.sh), and
# baked into the Docker image by ci.yml at build time. That keeps the deployed
# app's /api/version and /api/changelog in step with the code on every push,
# instead of trailing a separate post-merge bump commit by one release.
#
# This workflow only ever pushes a *tag* ref — never the protected main branch —
# so it can't hit branch-protection (GH006).
#
# Job graph (push to main):
#   release  →  android            (ubuntu)
#            ↘  desktop            (macos)
#            ↘  sync-version-files (self-hosted)
# android / desktop / sync-version-files run only when a new tag was created.
# sync-version-files opens a rolling PR so the committed VERSION,
# pyproject.toml, and CHANGELOG.md catch up with the tag through the normal
# merge queue — it never pushes main and never queues its own merge.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  models: read # GitHub Models inference for the changelog entry
  pull-requests: write # sync-version-files opens the version catch-up PR

jobs:
  # ── 1. Compute version, create the tag, summarize the changelog ──────────────

  release:
    name: Tag release
    runs-on: [self-hosted]
    outputs:
      released: ${{ steps.tag.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      notes: ${{ steps.ai.outputs.response }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute version
        id: version
        run: bash scripts/next_version.sh >> "$GITHUB_OUTPUT"

      - name: Create and push tag (tag ref only)
        id: tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — nothing to release."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tagging $TAG"
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Changelog notes for the GitHub Releases (GITHUB_TOKEN only) ──

      - name: Collect commits since previous tag
        if: steps.tag.outputs.released == 'true'
        id: log
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -vx "${{ steps.version.outputs.tag }}" | head -1)
          RANGE="HEAD"
          [ -n "$PREV_TAG" ] && RANGE="${PREV_TAG}..HEAD"
          {
            echo "commits<<COMMITS_EOF"
            git log --no-merges --pretty=format:'- %s' "$RANGE"
            echo
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog entry (Pi)
        if: steps.tag.outputs.released == 'true'
        id: ai
        continue-on-error: true
        env:
          SYSTEM_PROMPT: |
            You write the "What's new" notes that everyday users of a news
            dashboard app see in an in-app popup after the app updates. Your
            readers are NOT developers — write for them, not for engineers.

            Given raw git commit subjects, output ONLY markdown "- " bullet
            lines. Rules:
            - Describe the benefit to the user — what they can now do, see, or
              no longer have to deal with — not the technical change that
              delivered it.
            - Write in plain, friendly language. Address the user as "you" /
              "your" where natural.
            - NO jargon, internal names, file paths, config keys, library or
              service names (e.g. Helm, Langfuse, cache, endpoint, API, schema,
              migration), version numbers, or ticket/PR references.
            - Merge related commits into a single user-facing bullet.
            - Omit anything with no visible effect for users — chore, ci, test,
              refactor, docs, deploy/infra, observability, and other internal
              work. If a release is entirely internal, summarize it as a single
              bullet like "Stability and performance improvements."
            Output no headings, no version number, and no preamble — bullets only.
          PROMPT: |
            Commits for release ${{ steps.version.outputs.tag }}:
            ${{ steps.log.outputs.commits }}
          COMMITS: ${{ steps.log.outputs.commits }}
        run: |
          # Define the extension path here so $HOME expands — a "$HOME/…" value
          # set in a YAML env: block is passed to pi as a literal, unexpanded.
          PI_EXTENSION="$HOME/pi/packages/coding-agent/examples/extensions/lihor-provider"
          changelog=$(pi -e "$PI_EXTENSION" -p "$SYSTEM_PROMPT

          $PROMPT" || true)
          # Strip any leaked model reasoning (<think> blocks, prompt
          # narration, code fences) before it can reach a GitHub Release or
          # CHANGELOG.md.
          changelog=$(printf '%s\n' "$changelog" | python3 scripts/humanize_commits.py --sanitize)
          # If inference returned nothing usable, fall back to a user-facing
          # summary of the commits — never raw "chore:/ci:" subjects or model
          # reasoning a customer can't read.
          if [ -z "$(printf '%s' "$changelog" | tr -d '[:space:]')" ]; then
            changelog=$(printf '%s\n' "$COMMITS" | python3 scripts/humanize_commits.py)
          fi
          {
            echo "response<<EOF"
            echo "$changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ── 2a. Build and sign Android APK ───────────────────────────────────────────

  android:
    name: Android APK
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Inject version (not committed — only for this build)
        env:
          VERSION: ${{ needs.release.outputs.version }}
          CODE: ${{ needs.release.outputs.code }}
        run: bash scripts/inject_app_version.sh android

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/android.keystore

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PstoreFile="$GITHUB_WORKSPACE/android/android.keystore" \
            -PstorePassword="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PkeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PkeyPassword="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Rename APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          V="${{ needs.release.outputs.version }}"
          DEST="news-dashboard-android-v${V}.apk"
          cp "$APK" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ needs.release.outputs.notes }}
        run: |
          V="${{ needs.release.outputs.version }}"
          NOTES_FILE="$RUNNER_TEMP/android-notes.md"
          {
            if [ -n "$CHANGELOG" ]; then
              printf "## What's new\n\n%s\n\n---\n\n" "$CHANGELOG"
            fi
            echo "Signed APK built from ${{ needs.release.outputs.tag }}."
          } > "$NOTES_FILE"
          gh release create "android-v$V" \
            "${{ steps.apk.outputs.path }}" \
            --title "Android APK v$V" \
            --notes-file "$NOTES_FILE" \
            --latest

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: news-dashboard-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

  # ── 2b. Build Desktop DMG ────────────────────────────────────────────────────

  desktop:
    name: Desktop DMG
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Inject version (not committed — only for this build)
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: bash scripts/inject_app_version.sh desktop

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build universal DMG
        working-directory: desktop
        # --publish never: prevent electron-builder from trying to push to
        # GitHub itself (it reads the publish: config and demands GH_TOKEN in
        # CI).  The manifest files (latest-mac.yml) are still written to dist/
        # and uploaded manually by the "Create GitHub Release" step below.
        run: npm run build:mac -- --publish never

      - name: Find DMG and update manifest
        id: dmg
        run: |
          DMG=$(find desktop/dist -name "*.dmg" | head -1)
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          ls -lh "$DMG"
          # electron-builder generates latest-mac.yml alongside the DMG.
          # electron-updater fetches this file to discover new versions.
          MANIFEST=$(find desktop/dist -name "latest-mac.yml" | head -1)
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ needs.release.outputs.notes }}
        run: |
          V="${{ needs.release.outputs.version }}"
          NOTES="Unsigned macOS DMG (universal — Intel + Apple Silicon).

          First launch: right-click News Dashboard.app in Finder → Open → Open
          Or in Terminal: xattr -cr \"/Applications/News Dashboard.app\"

          Built from ${{ needs.release.outputs.tag }}."
          if [ -n "$CHANGELOG" ]; then
            NOTES="## What's new

          $CHANGELOG

          ---
          $NOTES"
          fi

          ASSETS=("${{ steps.dmg.outputs.path }}")
          MANIFEST="${{ steps.dmg.outputs.manifest }}"
          if [ -n "$MANIFEST" ] && [ -f "$MANIFEST" ]; then
            ASSETS+=("$MANIFEST")
          fi

          gh release create "desktop-v$V" \
            "${ASSETS[@]}" \
            --title "Desktop App v$V" \
            --notes "$NOTES" \
            --latest

  # ── 2c. Catch the committed version files up with the new tag ────────────────
  #
  # The deployed version is tag-derived and baked into the image at build time,
  # so the committed VERSION / pyproject.toml / CHANGELOG.md would otherwise
  # drift a little further behind on every release. This job proposes the
  # catch-up as a rolling PR (branch bot/sync-versioning, force-pushed each
  # release). It must go through the merge queue like any other change: no push
  # to main, and it never queues its own merge (a repo test enforces this).
  #
  # PRs created with the default GITHUB_TOKEN do not trigger CI runs, so the
  # required checks stay "Expected" until a human closes/reopens the PR or
  # pushes to it. To make the checks start automatically, add a fine-grained
  # PAT secret named VERSIONING_SYNC_TOKEN (contents + pull requests: write).

  sync-version-files:
    name: Sync committed version files
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: [self-hosted]
    # Serialize concurrent releases: two runs force-pushing the same rolling
    # branch would otherwise race and leave it pointing at the older catch-up.
    concurrency:
      group: sync-version-files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.VERSIONING_SYNC_TOKEN || github.token }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update VERSION, pyproject.toml, and CHANGELOG.md
        env:
          V: ${{ needs.release.outputs.version }}
          NOTES: ${{ needs.release.outputs.notes }}
        run: |
          echo "$V" > VERSION
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("pyproject.toml")
          text = re.sub(
              r'^version = ".*"$',
              f'version = "{os.environ["V"]}"',
              path.read_text(),
              count=1,
              flags=re.MULTILINE,
          )
          path.write_text(text)
          PY
          BODY="$NOTES"
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            BODY="- Stability and performance improvements."
          fi
          # Date the entry from the released commit, not from when this job
          # happens to run — a re-run or an over-midnight queue must not shift
          # the recorded release date.
          DATE="$(git log -1 --format=%cs HEAD)"
          printf '%s\n' "$BODY" | python3 scripts/update_changelog.py --version "$V" --date "$DATE"

      - name: Push rolling sync branch and open PR
        env:
          GH_TOKEN: ${{ secrets.VERSIONING_SYNC_TOKEN || github.token }}
          V: ${{ needs.release.outputs.version }}
        run: |
          BRANCH="bot/sync-versioning"
          if git diff --quiet; then
            echo "Version files already in sync — nothing to propose."
            exit 0
          fi
          # A branch whose PR is in the merge queue rejects pushes (GH006).
          # That's an expected race, not an error: the queued PR merges, and
          # the next release proposes the remaining catch-up.
          PR_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            QUEUED="$(gh api graphql \
              -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){isInMergeQueue}}}' \
              -f o="${GITHUB_REPOSITORY%/*}" -f r="${GITHUB_REPOSITORY#*/}" -F n="$PR_NUMBER" \
              --jq '.data.repository.pullRequest.isInMergeQueue')"
            if [ "$QUEUED" = "true" ]; then
              echo "Sync PR #$PR_NUMBER is queued in the merge queue — skipping; the next release will catch up."
              exit 0
            fi
          fi
          git switch -c "$BRANCH"
          git add VERSION pyproject.toml CHANGELOG.md
          git commit -m "chore: sync VERSION and CHANGELOG for v$V"
          git push -f origin "HEAD:refs/heads/$BRANCH"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore: sync VERSION and CHANGELOG for v$V" \
              --body "$(printf 'Automated catch-up of the committed VERSION, pyproject.toml, and CHANGELOG.md to match the released tag v%s.\n\nIf the required checks never start, close and reopen this PR (or configure a VERSIONING_SYNC_TOKEN secret so they start automatically).' "$V")"
          else
            gh pr edit "$PR_NUMBER" --title "chore: sync VERSION and CHANGELOG for v$V"
            echo "Sync PR #$PR_NUMBER already open — branch force-pushed with the latest catch-up."
          fi
