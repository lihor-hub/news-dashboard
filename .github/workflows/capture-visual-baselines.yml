name: Capture visual baseline evidence

# Temporary artifact generator for #1554; removed before the delivery PR.
# Existing assertion workflows and their comparison policy remain untouched.
on:
  push:
    branches: [fix/visual-baselines-1554]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate the complete baseline matrix with pinned Chromium
        run: npm run test:visual -- --update-snapshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: visual-baseline-evidence
          path: e2e/visual-states.spec.ts-snapshots/
