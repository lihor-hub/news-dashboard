name: Desktop App (manual)

# Manual build only — automatic releases are handled by release.yml.
# Use this for testing the build without triggering a version bump.
# Builds unsigned macOS, Linux, and Windows installers and update assets.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Compute version
        id: version
        run: bash scripts/next_version.sh >> "$GITHUB_OUTPUT"
      - name: Inject version (build only)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/inject_app_version.sh desktop
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Test desktop helpers
        working-directory: desktop
        run: npm test
      - name: Build installer and update payloads
        working-directory: desktop
        run: npm run build:${{ matrix.platform }} -- --publish never
      - name: Collect required installers and update metadata
        run: bash scripts/collect_desktop_assets.sh "${{ matrix.platform }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: news-dashboard-desktop-${{ matrix.platform }}-v${{ steps.version.outputs.version }}-manual
          path: desktop/dist/release-assets/*
          if-no-files-found: error
          retention-days: 7
