name: CI / CD

# Runs tests + typecheck on every PR.
# On push to main: also builds the Docker image, pushes it to GHCR, and
# deploys to the mini PC via a self-hosted runner running directly on the machine.
#
# PR strategy: change-aware routing so small backend-only or frontend-only
# changes don't run every unrelated test lane. Smoke tests always run.
# Full suite runs on every push to main and on demand via workflow_dispatch.
#
# Branch is 'main'. If you rename it to 'master', update the two filters below.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue: GitHub builds a temporary merge_group ref and waits for the
  # required checks before landing the PR on main. The test lanes below treat
  # merge_group like a push (full suite) so the queue gates on real results.
  merge_group:
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run the full test suite (backend + frontend + coverage)'
        required: false
        default: 'true'
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Full image name. GITHUB_REPOSITORY is "owner/repo" (lower-cased by GHCR).
  IMAGE: ghcr.io/${{ github.repository }}

# Minimum permissions at the workflow root. Jobs that need more (packages:write
# and models:read for publish, security-events:write for trivy, pull-requests:write
# for coverage-upload) declare their own narrower `permissions:` block below —
# see .github/workflows/trivy-scan.yml, dependency-review.yml, release.yml, and
# pr-timing.yml for the same per-job pattern.
permissions:
  contents: read

jobs:
  # ── 0. DETECT CHANGES ──────────────────────────────────────────────────────
  # Determine which parts of the codebase changed so later jobs can skip
  # unrelated test lanes on pull requests.
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      a11y: ${{ steps.filter.outputs.a11y }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pyproject.toml'
              - 'scripts/**'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'index.html'
              - 'tsconfig*.json'
            a11y:
              - 'frontend/**'
              - 'e2e/a11y.spec.ts'
              - 'e2e/a11y-helper.ts'
              - 'e2e/fixtures.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright.config.ts'
              - 'vite.config.ts'
              - 'index.html'
              - 'public/manifest.webmanifest'

  # ── 1. LINT ────────────────────────────────────────────────────────────────
  # Static analysis only — fails fast and in parallel with the test jobs.
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -e '.[dev]'
      - name: ruff (lint)
        run: ruff check backend
      - name: ruff (format check)
        run: ruff format --check backend
      - name: mypy
        run: mypy backend
      - name: ty
        run: ty check backend
      - name: pyrefly
        run: pyrefly check backend
      - name: vulture (dead code)
        run: vulture backend backend/vulture_whitelist.py --min-confidence 80

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: eslint
        run: npm run lint --silent
      - name: prettier (format check)
        run: npm run format:check --silent
      - name: TypeScript
        run: npm run typecheck --silent
      - name: knip (dead exports & deps)
        run: npm run dead-code --silent

  # ── 2. SMOKE ───────────────────────────────────────────────────────────────
  # Always runs on PRs and manual dispatches. Fast: no Postgres, no coverage.
  # Covers app boot, health endpoints, and core frontend render paths.
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    # Skip on push to main — the full test job already covers it.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Backend smoke tests
        run: |
          COUNT=$(pytest -m smoke --collect-only -q 2>/dev/null | grep -c "::test_" || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: smoke test collection returned zero tests — check marker configuration" >&2
            exit 1
          fi
          pytest -m smoke -v

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Frontend smoke tests
        run: |
          npm run test:frontend:smoke --silent

  # ── 3. TEST (BACKEND) ──────────────────────────────────────────────────────
  # On pull requests: runs only when backend files changed (or forced via dispatch).
  # On push to main: always runs.
  test-backend:
    name: Backend tests
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'workflow_dispatch' && inputs.full_suite == 'true') ||
      (github.event_name == 'pull_request' && needs.detect-changes.outputs.backend == 'true')
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_DB: news_dashboard
          POSTGRES_USER: news_dashboard
          POSTGRES_PASSWORD: news_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Backend tests
        run: >
          pytest -v --cov --cov-report=term-missing --cov-report=xml --durations=20
          -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true
        env:
          DATABASE_URL: postgresql://news_dashboard:news_dashboard@127.0.0.1:5432/news_dashboard
          TEST_DATABASE_URL: postgresql://news_dashboard:news_dashboard@127.0.0.1:5432/news_dashboard
      - name: Save backend coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: coverage.xml

  # ── 4. TEST (FRONTEND) ─────────────────────────────────────────────────────
  # On pull requests: runs only when frontend files changed (or forced via dispatch).
  # On push to main: always runs (includes build / tsc typecheck).
  test-frontend:
    name: Frontend tests & build
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'workflow_dispatch' && inputs.full_suite == 'true') ||
      (github.event_name == 'pull_request' && needs.detect-changes.outputs.frontend == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: vitest (frontend tests)
        run: npm run test:frontend:coverage --silent
      - name: Save frontend coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: coverage/lcov.info
      - name: build (includes tsc)
        run: npm run build

  # ── 5. A11Y ────────────────────────────────────────────────────────────────
  # Runs the accessibility smoke test suite on PRs and pushes.
  # Change-aware: skips when no frontend/a11y-related files changed.
  # On push to main / merge_group: always runs.
  test-a11y:
    name: Accessibility tests
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'workflow_dispatch' && inputs.full_suite == 'true') ||
      (github.event_name == 'pull_request' && needs.detect-changes.outputs.a11y == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Accessibility smoke tests
        run: npx playwright test e2e/a11y.spec.ts

  # ── 6. TEST ROLLUP ─────────────────────────────────────────────────────────
  # Satisfies the "Test & build" required status check while the component jobs
  # use the new change-aware names. Skips if any component job is skipped
  # (all-skipped = no relevant files changed, so the check still passes).
  test:
    name: Test & build
    needs: [test-backend, test-frontend, test-a11y]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Aggregate test results
        run: |
          backend="${{ needs.test-backend.result }}"
          frontend="${{ needs.test-frontend.result }}"
          a11y="${{ needs.test-a11y.result }}"
          if [[ "$backend" == "failure" || "$backend" == "cancelled" ]]; then
            echo "Backend tests failed or were cancelled ($backend)" && exit 1
          fi
          if [[ "$frontend" == "failure" || "$frontend" == "cancelled" ]]; then
            echo "Frontend tests failed or were cancelled ($frontend)" && exit 1
          fi
          if [[ "$a11y" == "failure" || "$a11y" == "cancelled" ]]; then
            echo "Accessibility tests failed or were cancelled ($a11y)" && exit 1
          fi
          echo "All test lanes passed (backend=$backend, frontend=$frontend, a11y=$a11y)"
  # ── 7. COVERAGE UPLOAD ─────────────────────────────────────────────────────
  # Uploads coverage reports to Codecov for PR comments, status checks, and
  # coverage trends. Merge groups run the full test suite, so they also upload
  # coverage to keep queued merges covered by the same Codecov flag wiring.
  coverage-upload:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download backend coverage
        if: needs.test-backend.result == 'success' || needs.test-backend.result == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backend-coverage
          path: ./coverage-backend

      - name: Check backend coverage report
        id: backend-coverage
        run: |
          if compgen -G "./coverage-backend/*.xml" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download frontend coverage
        if: needs.test-frontend.result == 'success' || needs.test-frontend.result == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-coverage
          path: ./coverage-frontend

      - name: Check frontend coverage report
        id: frontend-coverage
        run: |
          if [[ -f "./coverage-frontend/lcov.info" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Backend to Codecov
        if: steps.backend-coverage.outputs.exists == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-backend/*.xml
          flags: backend
          name: codecov-backend
          fail_ci_if_error: false
          verbose: true

      - name: Upload Frontend to Codecov
        if: steps.frontend-coverage.outputs.exists == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-frontend/lcov.info
          flags: frontend
          name: codecov-frontend
          fail_ci_if_error: false
          verbose: true

  # ── 8. HELM VALIDATE ───────────────────────────────────────────────────────
  # Lints and renders the Helm chart with default and production-like values.
  # Runs on every push/PR so a broken template fails well before the deploy job.
  # No live cluster is required — this is render/lint only.
  helm-validate:
    name: Helm chart validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: latest

      - name: helm lint
        run: helm lint ./helm/news-dashboard

      - name: helm template (defaults)
        run: |
          SESSION_SECRET=dummy-session-secret-for-render-only
          POSTGRES_PASSWORD=dummy-postgres-password-for-render-only
          source ./scripts/production-deploy-lib.sh
          prepare_production_helm_secret_files
          helm template news-dashboard ./helm/news-dashboard \
            "${PRODUCTION_HELM_SECRET_ARGS[@]}"

      - name: helm template (production-like overrides)
        run: |
          SESSION_SECRET=dummy-session-secret-for-render-only
          POSTGRES_PASSWORD=dummy-postgres-password-for-render-only
          source ./scripts/production-deploy-lib.sh
          prepare_production_helm_secret_files
          helm template news-dashboard ./helm/news-dashboard \
            --values ./helm/news-dashboard/values-production.yaml \
            --set "image.repository=ghcr.io/lihor-hub/news-dashboard" \
            --set-string "image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            --set "image.pullSecretName=ghcr-pull-secret" \
            --set-string "postgresql.persistence.hostPath=" \
            "${PRODUCTION_HELM_SECRET_ARGS[@]}" \
            --set "app.ai.existingSecret=news-dashboard-ai" \
            --set "app.push.existingSecret=news-dashboard-push" \
            --set "app.email.existingSecret=news-dashboard-email" \
            --set-string "app.ai.freeLlmBaseUrl=https://llm-gateway.example.test/v1" \
            --set-string "app.ai.briefingModel=gpt-4o" \
            --set-string "app.ai.langfuse.host=http://langfuse.local" \
            --set-string "app.push.email=test@example.com"

      - name: helm template (external postgresql)
        run: |
          SESSION_SECRET=dummy-session-secret-for-render-only
          POSTGRES_PASSWORD=dummy-postgres-password-for-render-only
          source ./scripts/production-deploy-lib.sh
          prepare_production_helm_secret_files
          helm template news-dashboard ./helm/news-dashboard \
            --set "postgresql.enabled=false" \
            --set "app.databaseUrl.existingSecret=news-dashboard-db" \
            "${PRODUCTION_HELM_SECRET_ARGS[@]}"

  # ── 9. PUBLISH ─────────────────────────────────────────────────────────────
  # Builds one image and pushes two tags:
  #   :<sha>    — source-discovery alias for the exact commit
  #   :latest   — floating convenience tag for manual pulls / rollback reference
  #
  # Why two tags? "latest" alone is not enough: if the tag name hasn't changed,
  # a node with imagePullPolicy: IfNotPresent won't re-pull it.  Pinning to the
  # deployment uses the registry digest output, so tag movement cannot change
  # the manifest selected by Kubernetes.
  #
  # No secrets needed here — GITHUB_TOKEN is provided automatically and has
  # packages:write by default for the repo that owns the package.
  publish:
    name: Build & push image
    needs: [lint, test, helm-validate]
    runs-on: [self-hosted]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      models: read # GitHub Models inference for the changelog entry
      id-token: write
      attestations: write
    outputs:
      image_tag: ${{ github.sha }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tags + history for version computation

      # No actions/setup-python here: this job runs on the self-hosted runner,
      # which has no prebuilt Python 3.14 in the actions tool-cache for its
      # OS/arch (setup-python fails with "version '3.14' … was not found").
      # The changelog step only needs the runner's system python3 to run
      # scripts/update_changelog.py (pure stdlib), matching release.yml's
      # self-hosted job, which also runs without setup-python.

      # Derive the release version from tags + commits and bake it into the
      # image, so /api/version and /api/changelog match the deployed code.
      # release.yml computes the same value from the same script and tags it.
      - name: Compute version
        id: version
        run: bash scripts/next_version.sh >> "$GITHUB_OUTPUT"

      - name: Collect commits since last tag
        id: log
        run: |
          LAST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
          RANGE="HEAD"
          [ -n "$LAST_TAG" ] && RANGE="${LAST_TAG}..HEAD"
          {
            echo "commits<<COMMITS_EOF"
            git log --no-merges --pretty=format:'- %s' "$RANGE"
            echo
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog entry (Pi)
        id: ai
        continue-on-error: true
        env:
          SYSTEM_PROMPT: |
            You write the "What's new" notes that everyday users of a news
            dashboard app see in an in-app popup after the app updates. Your
            readers are NOT developers — write for them, not for engineers.

            Given raw git commit subjects, output ONLY markdown "- " bullet
            lines. Rules:
            - Describe the benefit to the user — what they can now do, see, or
              no longer have to deal with — not the technical change that
              delivered it.
            - Write in plain, friendly language. Address the user as "you" /
              "your" where natural.
            - NO jargon, internal names, file paths, config keys, library or
              service names (e.g. Helm, Langfuse, cache, endpoint, API, schema,
              migration), version numbers, or ticket/PR references.
            - Merge related commits into a single user-facing bullet.
            - Omit anything with no visible effect for users — chore, ci, test,
              refactor, docs, deploy/infra, observability, and other internal
              work. If a release is entirely internal, summarize it as a single
              bullet like "Stability and performance improvements."
            Output no headings, no version number, and no preamble — bullets only.
          PROMPT: |
            Commits for release ${{ steps.version.outputs.tag }}:
            ${{ steps.log.outputs.commits }}
        run: |
          # Define the extension path here so $HOME expands — a "$HOME/…" value
          # set in a YAML env: block is passed to pi as a literal, unexpanded.
          PI_EXTENSION="$HOME/pi/packages/coding-agent/examples/extensions/lihor-provider"
          changelog=$(pi -e "$PI_EXTENSION" -p "$SYSTEM_PROMPT

          $PROMPT")
          {
            echo "response<<EOF"
            echo "$changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bake version + changelog into the build context
        env:
          V: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.ai.outputs.response }}
          COMMITS: ${{ steps.log.outputs.commits }}
        run: |
          echo "$V" > VERSION
          # Strip any leaked model reasoning (<think> blocks, prompt
          # narration, code fences) before it can reach CHANGELOG.md.
          BODY=$(printf '%s\n' "$NOTES" | python3 scripts/humanize_commits.py --sanitize)
          # If inference returned nothing usable, fall back to a user-facing
          # summary of the commits — never raw "chore:/ci:" subjects or model
          # reasoning a customer can't read.
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            BODY=$(printf '%s\n' "$COMMITS" | python3 scripts/humanize_commits.py)
          fi
          printf '%s\n' "$BODY" | python3 scripts/update_changelog.py --version "$V"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      # SBOM (SPDX) for the exact image digest just pushed. Kept as a build
      # artifact and attested below so consumers can verify contents.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      # Cryptographically ties the SBOM and the build to this repo's CI run.
      # Verify with: gh attestation verify --repo <owner>/<repo> --owner <owner> <image>
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ── 10. DEPLOY ─────────────────────────────────────────────────────────────
  # Runs directly on the self-hosted runner (the mini PC itself) — no SSH hop
  # needed. The runner process on the mini PC picks up the job and executes
  # the deploy commands locally.
  #
  # Concurrency: cancel-in-progress: false means a second push waits rather
  # than racing.  Never cancel a deploy mid-flight.
  #
  # ┌──────────────────────────────────────────────────────────────────────┐
  # │  SECRETS — add in: GitHub repo → Settings → Secrets → Actions       │
  # │                                                                      │
  # │  GHCR_TOKEN       Optional when the GHCR package is public. Required │
  # │                   for private packages: use a GitHub Personal Access │
  # │                   Token with the *read:packages* scope (nothing else).│
  # │                   Create at: github.com/settings/tokens              │
  # │                   (Classic token, read:packages, 1-year expiry.)     │
  # │                   This lets the mini PC pull the image from GHCR.    │
  # │                                                                      │
  # │  SESSION_SECRET   A long random string used to sign app sessions.    │
  # │                   Required when Keycloak auth is enabled.            │
  # │                                                                      │
  # │  POSTGRES_        Password for the bundled in-cluster PostgreSQL      │
  # │  PASSWORD         StatefulSet. Required when postgresql.enabled is   │
  # │                   true (the default). Changing this secret in the    │
  # │                   cluster does NOT rotate an already-initialized     │
  # │                   database password; existing deployments that used  │
  # │                   the old default must run ALTER USER on Postgres    │
  # │                   separately.                                        │
  # │                                                                      │
  # │  SENTRY_DSN       Optional Sentry project DSN for backend error       │
  # │                   tracking. Stored as a secret and exposed to pods as │
  # │                   SENTRY_DSN.                                        │
  # │                                                                      │
  # │  SENTRY_DSN_      Optional Sentry project DSN for frontend/UI error   │
  # │  FRONTEND         tracking. Stored as a secret and exposed publicly   │
  # │                   through GET /api/config as SENTRY_DSN_FRONTEND.     │
  # │                                                                      │
  # │  SMTP_USERNAME    Optional Gmail SMTP creds used to send OTP sign-in  │
  # │  SMTP_PASSWORD    emails (send_otp_email). SMTP_PASSWORD must be a    │
  # │                   Gmail App Password, not the account password. This  │
  # │                   is a Gmail-only compatibility alias; self-hosters   │
  # │                   using a non-Gmail relay set OTP_SMTP_HOST/PORT/     │
  # │                   USER/PASS/FROM/TLS via Helm's app.email.smtp*       │
  # │                   values instead (see helm/news-dashboard/values.yaml│
  # │                   and .env.example).                                 │
  # └──────────────────────────────────────────────────────────────────────┘
  deploy:
    name: Deploy to mini PC
    needs: [publish, trivy]
    runs-on: [self-hosted]
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy (Helm)
        id: deploy
        env:
          SHA: ${{ github.sha }}
          IMG: ${{ env.IMAGE }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FREE_LLM_API_KEY: ${{ secrets.FREE_LLM_API_KEY }}
          FREE_LLM_BASE_URL: ${{ vars.FREE_LLM_BASE_URL }}
          OPENAI_BRIEFING_MODEL: ${{ vars.OPENAI_BRIEFING_MODEL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST_PATH: ${{ vars.POSTGRES_HOST_PATH }}
          INGRESS_CUTOVER_ENABLED: ${{ vars.INGRESS_CUTOVER_ENABLED }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_EMAIL: ${{ vars.VAPID_EMAIL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_DSN_FRONTEND: ${{ secrets.SENTRY_DSN_FRONTEND }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIFY_CHAT_APP_TOKEN: ${{ secrets.DIFY_CHAT_APP_TOKEN }}
          DIFY_CHAT_BASE_URL: ${{ vars.DIFY_CHAT_BASE_URL }}
          DIFY_CHAT_TITLE: ${{ vars.DIFY_CHAT_TITLE }}
          # Non-secret strict JSON containing only networkPolicy.additionalEgress.
          # A repository/environment variable persists this input across upgrades.
          ADDITIONAL_EGRESS_VALUES: ${{ vars.ADDITIONAL_EGRESS_VALUES }}
        run: |
          set -euo pipefail
          echo "applied=false" >> "$GITHUB_OUTPUT"

          # Sync repository-controlled deployment logic before any cluster,
          # registry, or release mutation.
          cd ~/news-dashboard
          git fetch --prune origin main
          git checkout --detach FETCH_HEAD
          source ./scripts/production-deploy-lib.sh

          if ! production_cutover_enabled; then
            echo "Ingress cutover is not activated; published image retained and live release unchanged."
            exit 0
          fi

          if [ -z "$SESSION_SECRET" ]; then
            echo "SESSION_SECRET GitHub Actions secret is required for production auth." >&2
            exit 1
          fi

          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "POSTGRES_PASSWORD GitHub Actions secret is required for production DB." >&2
            exit 1
          fi

          if [ -z "$POSTGRES_HOST_PATH" ]; then
            echo "POSTGRES_HOST_PATH GitHub Actions variable is required to preserve production data." >&2
            exit 1
          fi
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Published IMAGE_DIGEST must be sha256:<64 lowercase hex characters>." >&2
            exit 1
          fi

          prepare_production_helm_secret_files
          additional_egress_helm_args=()
          if [ -n "$ADDITIONAL_EGRESS_VALUES" ]; then
            prepare_production_additional_egress_file - <<<"$ADDITIONAL_EGRESS_VALUES"
            additional_egress_helm_args+=(--values "$PRODUCTION_ADDITIONAL_EGRESS_FILE")
          fi

          kubectl create namespace news-dashboard --dry-run=client -o yaml | kubectl apply -f -

          if [ -n "$GHCR_TOKEN" ]; then
            # Private GHCR packages need both local Docker auth and a cluster pull secret.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            kubectl -n news-dashboard create secret docker-registry ghcr-pull-secret \
              --docker-server=ghcr.io \
              --docker-username="$GHCR_ACTOR" \
              --docker-password="$GHCR_TOKEN" \
              --dry-run=client -o yaml | kubectl apply -f -

            pull_secret_helm_args=(--set-string image.pullSecretName=ghcr-pull-secret)
          else
            echo "GHCR_TOKEN is empty; treating ${IMG}@${IMAGE_DIGEST} as a public GHCR image."
            pull_secret_helm_args=(--set-string image.pullSecretName=)
          fi

          # Pull eagerly — surfaces auth or visibility failures before touching the rollout.
          docker pull "${IMG}@${IMAGE_DIGEST}"

          ai_secret_args=()
          if [ -n "$OPENAI_API_KEY" ]; then
            ai_secret_args+=(--from-literal=OPENAI_API_KEY="$OPENAI_API_KEY")
          fi
          if [ -n "$FREE_LLM_API_KEY" ]; then
            ai_secret_args+=(--from-literal=FREE_LLM_API_KEY="$FREE_LLM_API_KEY")
          fi
          if [ -n "$LANGFUSE_PUBLIC_KEY" ]; then
            ai_secret_args+=(--from-literal=LANGFUSE_PUBLIC_KEY="$LANGFUSE_PUBLIC_KEY")
          fi
          if [ -n "$LANGFUSE_SECRET_KEY" ]; then
            ai_secret_args+=(--from-literal=LANGFUSE_SECRET_KEY="$LANGFUSE_SECRET_KEY")
          fi

          ai_helm_args=()
          if [ ${#ai_secret_args[@]} -gt 0 ]; then
            kubectl -n news-dashboard create secret generic news-dashboard-ai \
              "${ai_secret_args[@]}" \
              --dry-run=client -o yaml | kubectl apply -f -
            ai_helm_args+=(--set app.ai.existingSecret=news-dashboard-ai)
          fi
          if [ -n "$FREE_LLM_BASE_URL" ]; then
            ai_helm_args+=(--set-string "app.ai.freeLlmBaseUrl=$FREE_LLM_BASE_URL")
          fi
          if [ -n "$OPENAI_BRIEFING_MODEL" ]; then
            ai_helm_args+=(--set-string "app.ai.briefingModel=$OPENAI_BRIEFING_MODEL")
          fi
          if [ -n "$LANGFUSE_HOST" ]; then
            ai_helm_args+=(--set-string "app.ai.langfuse.host=$LANGFUSE_HOST")
          fi

          push_secret_args=()
          if [ -n "$VAPID_PUBLIC_KEY" ]; then
            push_secret_args+=(--from-literal=VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY")
          fi
          if [ -n "$VAPID_PRIVATE_KEY" ]; then
            push_secret_args+=(--from-literal=VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY")
          fi

          push_helm_args=()
          if [ ${#push_secret_args[@]} -gt 0 ]; then
            kubectl -n news-dashboard create secret generic news-dashboard-push \
              "${push_secret_args[@]}" \
              --dry-run=client -o yaml | kubectl apply -f -
            push_helm_args+=(--set app.push.existingSecret=news-dashboard-push)
          fi
          if [ -n "$VAPID_EMAIL" ]; then
            push_helm_args+=(--set-string "app.push.email=$VAPID_EMAIL")
          fi

          email_secret_args=()
          if [ -n "$SMTP_USERNAME" ]; then
            email_secret_args+=(--from-literal=SMTP_USERNAME="$SMTP_USERNAME")
          fi
          if [ -n "$SMTP_PASSWORD" ]; then
            email_secret_args+=(--from-literal=SMTP_PASSWORD="$SMTP_PASSWORD")
          fi

          email_helm_args=()
          if [ ${#email_secret_args[@]} -gt 0 ]; then
            kubectl -n news-dashboard create secret generic news-dashboard-email \
              "${email_secret_args[@]}" \
              --dry-run=client -o yaml | kubectl apply -f -
            email_helm_args+=(--set app.email.existingSecret=news-dashboard-email)
          fi

          sentry_helm_args=()
          sentry_secret_args=()
          if [ -n "$SENTRY_DSN" ]; then
            sentry_secret_args+=(--from-literal=SENTRY_DSN="$SENTRY_DSN")
          fi
          if [ -n "$SENTRY_DSN_FRONTEND" ]; then
            sentry_secret_args+=(--from-literal=SENTRY_DSN_FRONTEND="$SENTRY_DSN_FRONTEND")
          fi
          if [ ${#sentry_secret_args[@]} -gt 0 ]; then
            kubectl -n news-dashboard create secret generic news-dashboard-sentry \
              "${sentry_secret_args[@]}" \
              --dry-run=client -o yaml | kubectl apply -f -
            sentry_helm_args+=(--set app.sentry.existingSecret=news-dashboard-sentry)
            sentry_helm_args+=(--set-string app.sentry.environment=production)
            sentry_helm_args+=(--set-string "app.sentry.release=news-dashboard@$SHA")
          fi

          # Optional Dify assistant. Both the embed token and a browser-reachable
          # base URL are required; the chart refuses to render with only one of
          # them, so skip the feature entirely unless both are configured.
          # DIFY_CHAT_APP_TOKEN is the Publish -> Embed token, not a service key.
          dify_helm_args=()
          if [ -n "$DIFY_CHAT_APP_TOKEN" ] && [ -n "$DIFY_CHAT_BASE_URL" ]; then
            kubectl -n news-dashboard create secret generic news-dashboard-dify \
              --from-literal=DIFY_CHAT_APP_TOKEN="$DIFY_CHAT_APP_TOKEN" \
              --dry-run=client -o yaml | kubectl apply -f -
            dify_helm_args+=(--set app.dify.enabled=true)
            dify_helm_args+=(--set-string "app.dify.baseUrl=$DIFY_CHAT_BASE_URL")
            dify_helm_args+=(--set app.dify.existingSecret=news-dashboard-dify)
            if [ -n "$DIFY_CHAT_TITLE" ]; then
              dify_helm_args+=(--set-string "app.dify.title=$DIFY_CHAT_TITLE")
            fi
          elif [ -n "$DIFY_CHAT_APP_TOKEN" ] || [ -n "$DIFY_CHAT_BASE_URL" ]; then
            echo "Dify assistant needs both DIFY_CHAT_APP_TOKEN and DIFY_CHAT_BASE_URL; leaving it disabled." >&2
          fi

          # Clear the chart's legacy single-node default, then supply the
          # required installation-specific path only from runtime configuration.
          postgres_helm_args=(--set-string postgresql.persistence.hostPath=)
          postgres_helm_args+=(--set-string "postgresql.persistence.hostPath=$POSTGRES_HOST_PATH")

          # Production values keep the application behind a ClusterIP and make
          # the TLS Ingress the only public application route. Host-specific
          # storage remains a runtime override rather than repository inventory.
          helm_args=(
            upgrade --install news-dashboard ./helm/news-dashboard
            --namespace news-dashboard --create-namespace
            --values ./helm/news-dashboard/values-production.yaml
            --set "image.repository=${IMG}"
            --set-string "image.digest=${IMAGE_DIGEST}"
            "${additional_egress_helm_args[@]}"
            "${pull_secret_helm_args[@]}"
            "${postgres_helm_args[@]}"
            "${PRODUCTION_HELM_SECRET_ARGS[@]}"
            "${ai_helm_args[@]}"
            "${push_helm_args[@]}"
            "${email_helm_args[@]}"
            "${sentry_helm_args[@]}"
            "${dify_helm_args[@]}"
          )
          helm "${helm_args[@]}"
          echo "applied=true" >> "$GITHUB_OUTPUT"

          # Wait for the new pods to become ready.
          kubectl -n news-dashboard rollout status \
            deployment/news-dashboard-news-dashboard --timeout=120s

      # Pull-request CI validates rendered Ingress manifests in helm-validate
      # and never assumes access to the private production appliance.
      - name: Smoke test public TLS Ingress
        if: steps.deploy.outputs.applied == 'true'
        run: |
          curl -sf --max-time 10 --retry 6 --retry-delay 5 \
            https://news.lihor.ro/api/health | grep '"status":"ok"'

  # ── 11. TRIVY SCAN ─────────────────────────────────────────────────────────
  # Scans the container image for vulnerabilities using Trivy and uploads
  # results to GitHub Security tab as SARIF.
  trivy:
    name: Trivy vulnerability scan
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.publish.outputs.image_digest }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'  # Fail on any vulnerabilities
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
