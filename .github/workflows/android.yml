name: Android APK (manual)

# Manual build only — automatic releases are handled by release.yml.
# Use this for testing the build without triggering a version bump.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64   — base64-encoded android.keystore (JKS)
#   ANDROID_KEYSTORE_PASSWORD — keystore password
#   ANDROID_KEY_ALIAS         — key alias inside the keystore
#   ANDROID_KEY_PASSWORD      — key entry password

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & sign APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: bash scripts/next_version.sh >> "$GITHUB_OUTPUT"

      - name: Inject version (not committed — only for this build)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: bash scripts/inject_app_version.sh android

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/android.keystore

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PstoreFile="$GITHUB_WORKSPACE/android/android.keystore" \
            -PstorePassword="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PkeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PkeyPassword="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Find APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          VERSION="${{ steps.version.outputs.version }}"
          DEST="news-dashboard-android-v${VERSION}-manual-${{ github.run_number }}.apk"
          cp "$APK" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: news-dashboard-apk-v${{ steps.version.outputs.version }}-manual
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7
