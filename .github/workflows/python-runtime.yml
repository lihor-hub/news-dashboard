name: Python runtime validation

# Native production images and security evidence without registry publication.
on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/smoke-mcp-container.sh'
      - 'scripts/verify-oci-attestations.sh'
      - '.github/workflows/python-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  production:
    name: Production runtime (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.15'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - name: Install smoke client and OCI transport
        run: |
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          mkdir evidence
      - name: Exercise production release-version calculation and injection
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/next_version.sh > evidence/release-version.txt
          build_version=$(sed -n 's/^version=//p' evidence/release-version.txt)
          [[ "$build_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf '%s\n' "$build_version" > VERSION
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the actual production Dockerfile with SBOM and provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: news-dashboard-validation:runtime
          push: false
          sbom: true
          provenance: mode=max
          outputs: type=oci,dest=${{ runner.temp }}/runtime.tar
      - name: Verify attestations and load the exact runnable child
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          bash scripts/verify-oci-attestations.sh "$RUNNER_TEMP/runtime.tar" "$INDEX_DIGEST" evidence/oci "$ARCH"
          skopeo copy "oci-archive:$RUNNER_TEMP/runtime.tar" docker-daemon:news-dashboard-validation:runtime
          docker image inspect news-dashboard-validation:runtime > evidence/image-inspect.json
          docker run --rm news-dashboard-validation:runtime python -VV | tee evidence/python.txt
          docker run --rm news-dashboard-validation:runtime python -c 'from importlib.metadata import distributions; print("\n".join(sorted(d.metadata["Name"] + "==" + d.version for d in distributions())))' > evidence/production-freeze.txt
      - name: Execute version, CLI, init, health, readiness and MCP probes
        shell: bash
        run: |
          set -euo pipefail
          MCP_SMOKE_IMAGE=news-dashboard-validation:runtime scripts/smoke-mcp-container.sh 2>&1 | tee evidence/runtime-smoke.log
      - name: Scan actual runtime at the existing HIGH/CRITICAL policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: news-dashboard-validation:runtime
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Upload runtime SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: trivy-results.sarif
          category: python-runtime-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-runtime-${{ matrix.arch }}
          path: |
            evidence/
            trivy-results.sarif
