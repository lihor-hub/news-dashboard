# Non-secret operator overlay for private or custom service endpoints.
# Copy this outside the repository, replace the example CIDR/ports, and apply
# the file on every Helm upgrade through ADDITIONAL_EGRESS_VALUES_FILE.
networkPolicy:
  additionalEgress:
    - to:
        - ipBlock:
            cidr: 10.20.0.0/24
      ports:
        - protocol: TCP
          port: 5432
