{{- if and .Values.ingress.enabled .Values.ingress.traefik.middlewareEnabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "news-dashboard.fullname" . }}-redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "news-dashboard.fullname" . }}-security-headers
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
    permissionsPolicy: camera=(), microphone=(), geolocation=()
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
{{- end }}
