{{- if and .Values.production (ne .Values.service.type "ClusterIP") }}
{{- fail "service.type must be ClusterIP in production" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "news-dashboard.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "news-dashboard.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "news-dashboard.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
